name: CI

# Build + unit/loopback suite on every push and PR (the mesh workflow stays manual-only).
# The suite is fully self-contained: STUN and TURN are exercised against in-process fake
# servers, so no internet access, real relay, or native toolchain is needed on any OS.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # InteropTests build a prior release in-process; a shallow clone cannot
          # reach that commit and the suite silently skips them.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare distinct loopback addresses for the TURN lab
        if: runner.os == 'macOS'
        shell: bash
        run: bash .github/scripts/prepare-macos-loopback.sh
      - name: Run interop suite (its release-host build must not storm the parallel suite)
        run: >
          dotnet test tests/Pinhole.Tests
          -c Release --filter "FullyQualifiedName~InteropTests"
          --logger trx --logger "console;verbosity=detailed"
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
      - name: Run test suite
        run: >
          dotnet test tests/Pinhole.Tests
          -c Release --filter "Category!=Performance&FullyQualifiedName!~BoundedResourceTests&FullyQualifiedName!~InteropTests"
          --logger trx --logger "console;verbosity=detailed"
          --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type mini
      - name: Upload test results (hang diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresults-${{ matrix.os }}
          path: tests/Pinhole.Tests/TestResults/
          retention-days: 5

  resources:
    name: resources-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Collection isolation excludes concurrent test bodies, but cannot stop runtime
    # caches and lingering background work from earlier collections. A fresh testhost
    # makes the process-wide heap gate attributable to these resource scenarios.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Measure resources in a fresh test process
        run: >
          dotnet test tests/Pinhole.Tests -c Release
          --filter "FullyQualifiedName~BoundedResourceTests"
          --logger trx --logger "console;verbosity=detailed"
          --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type mini
      - name: Upload resource results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resources-${{ matrix.os }}
          path: tests/Pinhole.Tests/TestResults/
          retention-days: 5

  performance:
    name: throughput-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Use a fresh runner for the throughput gates. On macOS the same code measured
    # 107–164 KiB/s after the full suite, versus 929–936 KiB/s for both the previous
    # and current commits on an isolated runner. Keep the absolute floors intact.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run throughput floors without functional-test workloads
        run: >
          dotnet test tests/Pinhole.Tests -c Release
          --filter "Category=Performance"
          --logger trx --logger "console;verbosity=detailed"
          -- xUnit.MaxParallelThreads=1
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.os }}
          path: tests/Pinhole.Tests/TestResults/
          retention-days: 5

  mesh-local:
    name: mesh-smoke (3 nodes, one machine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish once
        run: dotnet publish samples/Pinhole.Mesh -c Release -o meshbin
      - name: Run three strangers over a filesystem signaling channel
        run: |
          export MESH_SIGNAL_DIR="$RUNNER_TEMP/signal"
          export MESH_DEADLINE_MS=90000
          mkdir -p "$MESH_SIGNAL_DIR"
          for i in 0 1 2; do
            MESH_LINGER=$([ "$i" = 0 ] && echo 1 || echo "") \
              dotnet meshbin/pinhole-mesh.dll node $i 3 > "$RUNNER_TEMP/node$i.log" 2>&1 &
          done
          FAIL=0
          for i in 0 1 2; do wait %$((i+1)) || FAIL=1; done
          echo "--- node logs ---"
          cat "$RUNNER_TEMP"/node*.log
          exit $FAIL

  bench:
    name: bench-canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Throughput and allocation canary
        run: |
          # Noninteractive, offline (loopback pair, no STUN/relays). The dps floor is
          # runner-calibrated (2 shared vCPUs reach ~60k; real hardware does 600k+); the
          # strict zero-allocation gate is the real signal.
          OUT=$(dotnet run --project samples/Pinhole.Bench -c Release -- 300000 64)
          echo "$OUT"
          DPS=$(echo "$OUT" | grep -oP '\d+(?= dps)')
          BPD=$(echo "$OUT" | grep -oP '[\d.]+(?= B/dgram)')
          echo "dps=$DPS per-dgram=$BPD B"
          if [ -z "$DPS" ] || [ -z "$BPD" ]; then
            echo "could not parse bench output"; exit 1
          fi
          awk -v dps="$DPS" 'BEGIN { exit (dps >= 25000) ? 0 : 1 }' \
            || { echo "FAIL: $DPS dps is under the 25000 canary floor"; exit 1; }
          awk -v bpd="$BPD" 'BEGIN { exit (bpd < 0.1) ? 0 : 1 }' \
            || { echo "FAIL: $BPD B/dgram exceeds the zero-allocation canary"; exit 1; }
          echo "BENCH CANARY PASS"
