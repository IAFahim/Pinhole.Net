name: Diag

# Temporary macOS hang bisection. Established so far: the suite hangs only under
# testhost (console probe passes all socket scenarios incl. PeerSocket punch), and
# only in collections whose components own dedicated blocking receive threads.
# This run captures managed stacks of the hung testhost with dotnet-stack.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stacks:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dotnet-stack
        run: dotnet tool install --global dotnet-stack
      - name: Run slice and capture hung testhost stacks
        run: |
          dotnet build tests/Pinhole.Tests
          dotnet test tests/Pinhole.Tests --no-build --filter "FullyQualifiedName~StunTests" --logger "console;verbosity=detailed" &
          TEST_PID=$!
          HOST_PID=""
          for i in $(seq 1 40); do
            HOST_PID=$(pgrep -f "testhost" | head -1 || true)
            if [ -n "$HOST_PID" ]; then break; fi
            sleep 2
          done
          echo "testhost pid: ${HOST_PID:-none}"
          if [ -z "$HOST_PID" ]; then
            echo "no testhost process found; test run may have finished:"
            wait $TEST_PID || true
            exit 0
          fi
          sleep 20   # let the hang settle in
          echo "=== dotnet-stack report ==="
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet-stack report -p "$HOST_PID" || true
          echo "=== test process still alive? ==="
          kill -0 $TEST_PID 2>/dev/null && echo "dotnet test alive (hung)" || echo "dotnet test exited"
          kill $TEST_PID 2>/dev/null || true
          sleep 2
          kill -9 $TEST_PID 2>/dev/null || true
