name: Diag

# Temporary macOS hang bisection: runs each test class in isolation with a hard
# timeout so the hanging class (then test) is identified in a single dispatch.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class:
    name: ${{ matrix.filter }}
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        filter: [PeerSocketTests, StunTests, TurnClientTests, RendezvousTests, EmptySanity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run one test class with hard timeout
        run: |
          if [ "${{ matrix.filter }}" = "EmptySanity" ]; then
            perl -e 'alarm shift; exec @ARGV' 100 dotnet test tests/Pinhole.Tests --filter "FullyQualifiedName~NonexistentClass" || echo "no tests matched (expected)"
            exit 0
          fi
          perl -e 'alarm shift; exec @ARGV' 100 dotnet test tests/Pinhole.Tests --filter "FullyQualifiedName~${{ matrix.filter }}" --logger "console;verbosity=detailed"
          echo "class filter ${{ matrix.filter }} finished with exit $?"
