[package]
name = "pinhole-quic-peer"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
base64 = "=0.22.1"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
